# Shared settings for the ABLATION STUDY (subset protocol).
#
# Hardware budget: one shared 4 GB GTX 1650 Ti, ~3 h wall-clock for the whole study, one run
# at a time.  A full-data epoch takes ~2 min, so the study uses a fixed, hash-selected 30 % of
# the patients (data.subset_fraction / subset_seed, see src/hgdr/data/splits.py::subsample_records):
# 9,349 / 1,182 / 1,196 train/val/test patients = 11,954 / 1,471 / 1,485 admissions.
# The SAME patients and the SAME patient-level split are used by every variant and seed;
# only the model initialisation / batch order change with seed.
#
# Protocol: at most 15 epochs, early stopping on validation Jaccard (patience 4, min 3 epochs),
# batch 256, AdamW lr 2e-3, seeds 0 and 1 (baselines: seed 0 and 1 as well). One HGDR run takes
# ~5-6 min on the GTX 1650 Ti when the GPU is not shared.
# Use configs/default.yaml (subset_fraction: 1.0, 30 epochs) for the full-scale run.
base: default.yaml
name: full
data:
  subset_fraction: 0.3
  subset_seed: 0
train:
  epochs: 15
  patience: 4
  batch_size: 256
  lr: 0.002
