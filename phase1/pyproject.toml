[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dti-gt"
version = "1.0.0"
description = "Graph-Transformer drug-target affinity prediction on KIBA (thesis Phase 1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.1",
  "torch-geometric>=2.4",
  "rdkit>=2023.9",
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "tqdm>=4.65",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
embed = ["transformers>=4.40", "sentencepiece"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:faulthandler"
filterwarnings = [
  "ignore::UserWarning",
  "ignore::DeprecationWarning",
]
